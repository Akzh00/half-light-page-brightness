<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Half-light</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Half-light</h1>
    <label class="switch">
      <input id="enabled" type="checkbox" role="switch" aria-label="Brightness adjustment" checked>
      <span class="track" aria-hidden="true"></span>
      <span class="state">On</span>
    </label>
  </header>
  <label class="level" for="brightness">
    <span class="visually-hidden">Brightness</span>
    <output id="value" for="brightness">100<span class="unit">%</span></output>
  </label>
  <input id="brightness" type="range" min="20" max="150" step="5" value="100">
  <div class="ends" aria-hidden="true"><span>Darker</span><span>Brighter</span></div>
  <button id="reset" type="button">Reset to 100%</button>
  <script src="popup.js"></script>
</body>
</html>
